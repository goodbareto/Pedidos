header.top h1{font:700 clamp(1.55rem, 8.4vw, 2.3rem)/.98 var(--titulo); color:var(--lima); text-transform:uppercase; letter-spacing:.01em; margin:0}
.pill{display:inline-block; margin-top:9px; border:2px solid var(--lima); border-radius:999px; padding:3px 12px;
  color:var(--lima); font:600 .88rem/1.3 var(--titulo)}
.hola{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:-18px 2px 32px; font:600 1.15rem var(--titulo)}

/* cada paso es un panel; su titulo va en una pastilla montada sobre el borde */
section{background:var(--panel); border:2px solid var(--linea); border-radius:22px; padding:16px; margin:0 0 32px}
section h2{display:table; font:600 1.02rem/1.25 var(--titulo); color:var(--lima); background:var(--verde); border:2px solid var(--lima);
  border-radius:18px; padding:5px 14px; margin:-33px 0 12px -4px}
section p.ayuda{margin:0 0 12px; color:var(--suave); font-size:.9rem}

/* opciones para elegir: sin marcar son un contorno lima; la elegida es una tarjeta lima con sombra violeta */
.opciones{display:grid; gap:10px}
.op{display:flex; gap:12px; align-items:center; border:2px solid var(--lima); border-radius:18px;
  padding:12px 14px; cursor:pointer; background:transparent; color:inherit; font:inherit; text-align:left; width:100%;
  transition:background .12s, box-shadow .12s, transform .12s}
.op::after{content:""; flex:none; width:24px; height:24px; margin-left:auto; border:2px solid var(--lima); border-radius:50%;
  font:800 .85rem/20px system-ui,sans-serif; text-align:center}
.op[aria-pressed="true"]{background:var(--lima); color:var(--tinta); box-shadow:4px 5px 0 var(--violeta); transform:translate(-2px,-2px)}
.op[aria-pressed="true"]::after{content:"\2713"; background:var(--tinta); border-color:var(--tinta); color:var(--lima)}
.op .t{font:600 1.05rem/1.25 var(--titulo)}
.op .d{display:block; color:var(--suave); font-size:.86rem}
.op[aria-pressed="true"] .d{color:inherit; opacity:.85}
.op .p{margin-left:auto; white-space:nowrap; font:700 1rem var(--titulo); font-variant-numeric:tabular-nums;
  background:var(--lima); color:var(--tinta); border-radius:999px; padding:6px 12px}
.op.memb::after{margin-left:0}
.op[aria-pressed="true"] .p{background:var(--tinta); color:var(--lima)}
.nivel{display:inline-block; border:2px solid var(--tinta); border-radius:999px; padding:1px 11px; background:var(--lima); color:var(--tinta);
  font:700 .8rem/1.4 var(--titulo); text-transform:uppercase; letter-spacing:.05em}
.nivel.bronce{background:var(--bronce)} .nivel.plata{background:var(--plata)} .nivel.oro{background:var(--oro)}
.gr{display:block; margin-top:6px; font-size:.9rem}
.gr b{display:block; font:700 1.8rem/1.05 var(--titulo)}

.gen{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--linea)}
.gen:first-of-type{border-top:0}
.gen .n{flex:1; min-width:0}
.gen .n b{display:block; font:600 1.05rem/1.25 var(--titulo)}
.gen .n small{color:var(--suave)}
.paso{display:flex; align-items:center; gap:6px}
.paso button{width:42px; height:42px; border-radius:50%; border:2px solid var(--lima); background:transparent;
  color:var(--lima); font-size:1.3rem; line-height:1; cursor:pointer}
.paso button:active:not(:disabled){background:var(--lima); color:var(--tinta)}
.paso button:disabled{opacity:.3; cursor:default}
.paso output{min-width:54px; text-align:center; font:600 1.05rem var(--titulo); font-variant-numeric:tabular-nums}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px}
.chip{border:2px solid var(--lima); border-radius:999px; padding:6px 13px; background:transparent; color:var(--lima);
  font:600 .9rem var(--titulo); cursor:pointer}
.chip:active{background:var(--lima); color:var(--tinta)}
.chip.cta{background:var(--lila); border-color:var(--lila); color:var(--tinta)}
.estado{margin-top:10px; font-size:.9rem; color:var(--suave)}
.estado.ok{color:var(--lima); font-weight:600}
.estado.mal{color:var(--peligro); font-weight:600}

label{display:block; font-size:.88rem; font-weight:600; color:#dcecc8; margin:12px 0 5px}
input[type=text], input[type=tel], input[type=password], textarea, select{width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--lima);
  background:var(--crema); color:var(--tinta); font:inherit}
input::placeholder, textarea::placeholder{color:#5d7b6d; opacity:1}
textarea{min-height:64px; resize:vertical}
input:focus, textarea:focus, select:focus, button:focus-visible{outline:3px solid var(--lila); outline-offset:2px}

.resumen{white-space:pre-wrap; font-size:.92rem; background:var(--crema); color:var(--tinta); border-radius:16px; padding:14px;
  margin:8px 5px 5px 0; box-shadow:4px 5px 0 var(--violeta)}
.pie{position:fixed; left:0; right:0; bottom:0; background:var(--petroleo); border-top:3px solid var(--lima); padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pie .in{max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center}
.pie .tot{flex:1; min-width:0}
.pie .tot small{display:block; color:#c4e3e6; font-size:.78rem}
.pie .tot b{font:700 1.4rem/1.1 var(--titulo); color:var(--lima); font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--lima); border-radius:999px; padding:12px 20px; font:700 1rem var(--titulo); cursor:pointer;
  background:var(--lima); color:var(--tinta); box-shadow:3px 4px 0 rgba(0,0,0,.3); transition:transform .08s, box-shadow .08s}
.btn:active:not(:disabled){transform:translate(2px,3px); box-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.45; cursor:default; box-shadow:none}
.btn.sec{background:transparent; color:var(--lima); box-shadow:none}
.aviso{font-size:.85rem; color:var(--suave); margin:10px 2px 0}
.falta{color:var(--peligro); font-size:.9rem; font-weight:600; margin:8px 0 0}
.prox{color:var(--suave); font-size:.85rem; margin:10px 0 0}
.dom{background:rgba(210,250,106,.09); border:2px dashed var(--linea); border-radius:14px; padding:10px 12px; margin:12px 0 0}
.dom small{display:block; color:var(--suave); font-size:.8rem}
.dom b{display:block}
.dom span{display:block; font-size:.88rem; color:var(--suave)}
.botones{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 0}
.pasos{margin:0 0 6px; padding-left:24px}
.pasos li{margin:0 0 10px}
.pasos li::marker{color:var(--lima); font:700 1.05rem var(--titulo)}
.pasos b{color:var(--lima)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

async function descifrar(codigo){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(codigo.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);

  $('#fCod').addEventListener('submit', async e => {

// ---------- cuenta del paciente (se crea una sola vez y queda en este dispositivo) ----------
function leerCuenta(){ try{ const a = JSON.parse(mem.get('cuenta') || 'null'); return a && a.no && a.d && a.ca ? a : null; }catch(e){ return null; } }
const nombreCuenta = () => (A.no + ' ' + A.ap).trim();
const domicilio = () => [[A.ca, A.pi].filter(Boolean).join(' '), A.ba, A.lo].filter(Boolean).join(', ');
// Una cuenta guardada con una version anterior del formulario puede no tener todos los datos: se pide completarla.
const cuentaCompleta = a => !!(a && a.no && a.ap && a.d && a.rp && a.te && a.ca && a.ba && a.lo);
const CLAVES = ['no', 'ap', 'd', 'rp', 'te', 'ca', 'pi', 'ba', 'lo', 're'];

// ---------- activacion ----------
// Crear la cuenta no alcanza para pedir: el club la aprueba y manda un enlace de activacion, que es una firma del DNI.
// Aca solo se puede comprobar la firma (con la clave publica que viene en la configuracion), no fabricarla.
// Un enlace que llega se guarda como candidato ('altaNueva'): recien reemplaza a la activacion guardada ('alta') si sirve para el DNI de esta cuenta.
// Asi, tocar por error el enlace de otra persona no desactiva una cuenta que ya estaba activa.
function tomarAlta(texto){
  const m = String(texto || '').match(/([A-Za-z0-9_-]{86})\.bc(?![A-Za-z0-9_-])/);
  if(m) mem.set('altaNueva', m[1]);
  return !!m;
}
async function firmaVale(firma){
  if(!firma) return false;
  try{
    const clave = await crypto.subtle.importKey('jwk', C.firma, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, clave, b64urlD(firma), new TextEncoder().encode('BC-ALTA|' + A.d));
  }catch(e){ return false; }
}
async function activa(){
  if(!C.firma) return true;                       // formulario generado sin aprobacion de cuentas
  if(!A || !window.crypto || !crypto.subtle) return false;
  const nueva = mem.get('altaNueva');
  if(nueva && await firmaVale(nueva)){ mem.set('alta', nueva); mem.set('altaNueva', ''); return true; }
  return firmaVale(mem.get('alta'));
}
async function entrar(){
  A = leerCuenta(); ACTIVA = false;
  if(!cuentaCompleta(A)) return pintarCuenta();
  ACTIVA = await activa();
  if(ACTIVA) pintar(); else pintarPendiente();
}
const urlWhatsApp = texto => 'https://wa.me/' + String(C.whatsapp || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(texto);
function abrirWhatsApp(texto){ window.open(urlWhatsApp(texto), '_blank'); }

  L.push('Barrio: ' + A.ba, 'Localidad: ' + A.lo);

}

async function guardarCuenta(){
  const v = k => $('#c_'+k).value.trim().replace(/\s+/g, ' ');
  const a = { no:v('no'), ap:v('ap'), d:v('d').replace(/\D/g, ''), rp:v('rp'), te:v('te'), ca:v('ca'), pi:v('pi'), ba:v('ba'), lo:v('lo'), re:v('re') };
  const f = [];
  if(!a.no) f.push('el nombre');
  if(!a.ap) f.push('el apellido');
  if(a.d.length < 7 || a.d.length > 8) f.push('el DNI (solo los números)');
  if(!a.rp) f.push('el número de inscripción de REPROCANN');
  if(a.te.replace(/\D/g, '').length < 8) f.push('el teléfono celular');
  if(!a.ca) f.push('la calle y el número');
  if(!a.ba) f.push('el barrio');
  if(!a.lo) f.push('la localidad');
  if(f.length){ $('#cErr').textContent = 'Falta: ' + f.join(', ') + '.'; return; }
  const antes = A, cambio = !antes || CLAVES.some(k => (antes[k] || '') !== a[k]);
  // Si cambio algo, el club tiene que recibirlo. La ventana de WhatsApp se abre ya, en el mismo toque (despues de una espera el navegador la bloquea),
  // y la direccion se le carga cuando se sabe si corresponde "solicitud de cuenta" o "cambio de datos": depende de si el enlace de activacion sirve para este DNI.
  const w = cambio ? window.open('', '_blank') : null;
  A = a; mem.set('cuenta', JSON.stringify(a));
  ACTIVA = await activa();
  if(cambio && w) w.location = urlWhatsApp(textoCuenta(ACTIVA));
  mem.set('cambioPend', cambio && ACTIVA ? '1' : ACTIVA ? mem.get('cambioPend') : '');   // recordatorio hasta que el paciente diga que envio el cambio
  window.scrollTo(0, 0);
  if(ACTIVA) return pintar();
  pintarPendiente(!cambio ? '' : w ? 'Se abrió WhatsApp con tu solicitud. Enviala para que el club la reciba.' : 'Tus datos quedaron guardados. Ahora tocá “Enviar solicitud por WhatsApp”.');
}

const membSel = () => C.membresias.find(m => m.id === P.memb) || null;
const sumFlores = () => Object.values(P.flores).reduce((a,b) => a + b, 0);
function maxExtra(){ const m = membSel(); if(!m || !C.prActivo) return 0;
  return Math.max(0, Math.floor((C.tope - m.gramos - m.prRegalo * C.prGramos) / C.prGramos)); }
const total = () => { const m = membSel(); return m ? m.precio + P.prExtra * C.prPrecio : 0; };

function alTocar(e){
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'bCuenta') return pintarCuenta();
  if(b.id === 'bVolver') return entrar();
  if(b.id === 'bSolicitud') return abrirWhatsApp(textoCuenta(false));
  if(b.id === 'bActivar') return activar();
  if(b.id === 'bCambio') return abrirWhatsApp(textoCuenta(true));
  if(b.id === 'bCambioOk'){ mem.set('cambioPend', ''); return pintar(); }
  if(b.id === 'bEnviar') return enviar();
  if(b.id === 'bCopiar') return copiar();
  if(PANT !== 'pedido') return;
  const d = b.dataset;
  if(d.memb){ P.memb = d.memb; P.flores = {}; P.prExtra = 0;
    if(C.geneticas.length === 1) P.flores[C.geneticas[0].id] = membSel().gramos;
    pintarGen(); pintarPr(); }
  else if(d.franja){ P.franja = d.franja; }
  else if(d.pago){ P.pago = d.pago; }
  else if(d.todo){ P.flores = {}; P.flores[d.todo] = membSel().gramos; }
  else if(d.mitad){ const m = membSel(), a = Math.ceil(m.gramos/2); P.flores = {}; P.flores[C.geneticas[0].id] = a; P.flores[C.geneticas[1].id] = m.gramos - a; }
  else if(d.mas){ const libre = membSel().gramos - sumFlores(); P.flores[d.mas] = (P.flores[d.mas]||0) + Math.min(C.paso, libre); }
  else if(d.menos){ P.flores[d.menos] = Math.max(0, (P.flores[d.menos]||0) - C.paso); }
  else if(d.pr){ P.prExtra = Math.min(maxExtra(), Math.max(0, P.prExtra + Number(d.pr))); }
  else return;
  actualizar();
}

function pintarPr(){

function faltantes(){
  const m = membSel(), f = [];
  if(!m) return ['elegir una membresía'];
  if(sumFlores() !== m.gramos) f.push('repartir los ' + m.gramos + ' g entre las genéticas');
  if(!P.franja) f.push('elegir el horario de entrega');
  if(!P.pago) f.push('la forma de pago');
  return f;
}

function textoPedido(conRef){
  const m = membSel(), prs = m.prRegalo + P.prExtra, p2 = n => String(n).padStart(2, '0'), d = new Date();
  const gen = id => (C.geneticas.find(x => x.id === id) || {}).nombre || '';
  const fl = C.geneticas.filter(x => P.flores[x.id] > 0).map(x => P.flores[x.id] + ' g ' + x.nombre).join(' + ');
  const L = ['*Pedido ' + C.club + (conRef ? ' N.º ' + P.ref : '') + '*'];
  if(conRef) L.push('Fecha: ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()));
  L.push('Paciente: ' + nombreCuenta(), 'DNI: ' + A.d, 'Membresía: ' + m.nombre + ' — ' + money(m.precio), 'Flores: ' + fl);
  if(m.prRegalo) L.push('Pre-rolled incluidos: ' + m.prRegalo);
  if(P.prExtra) L.push('Pre-rolled adicionales: ' + P.prExtra + ' (' + money(P.prExtra * C.prPrecio) + ')');
  if(prs) L.push('Genética de los pre-rolled: ' + (P.prGen ? gen(P.prGen) : 'indistinto'));
  if(m.prDiferido) L.push('Pre-rolled de regalo para otro pedido: ' + m.prDiferido);
  L.push('Entrega: ' + P.franja, 'Domicilio registrado: ' + domicilio(), 'Pago: ' + P.pago, 'Total: ' + money(total()));
  if(P.nota) L.push('Nota: ' + P.nota.replace(/\s+/g, ' '));
  return L.join('\n');
}

function actualizar(){
  const m = membSel();
  document.querySelectorAll('[data-memb]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.memb === P.memb)));
  document.querySelectorAll('[data-franja]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.franja === P.franja)));
  document.querySelectorAll('[data-pago]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pago === P.pago)));
  if(m){
    const libre = m.gramos - sumFlores();
    C.geneticas.forEach(x => {
      const o = document.querySelector('[data-out="'+x.id+'"]'); if(o) o.textContent = (P.flores[x.id]||0) + ' g';
      const mas = document.querySelector('[data-mas="'+x.id+'"]'), menos = document.querySelector('[data-menos="'+x.id+'"]');
      if(mas) mas.disabled = libre <= 0; if(menos) menos.disabled = !(P.flores[x.id] > 0);
    });
    const e = $('#eGen');
    if(e){ e.className = 'estado ' + (libre === 0 ? 'ok' : ''); e.textContent = libre === 0 ? 'Listo: ' + m.gramos + ' g repartidos.' : 'Te falta repartir ' + libre + ' g.'; }
    const sel = $('#prGen'); if(sel) P.prGen = sel.value;
    const oPr = $('#oPr'); if(oPr){ oPr.textContent = P.prExtra;
      document.querySelector('[data-pr="1"]').disabled = P.prExtra >= maxExtra(); document.querySelector('[data-pr="-1"]').disabled = P.prExtra <= 0; }
    const box = $('#prGenBox'); if(box) box.hidden = (m.prRegalo + P.prExtra) === 0;
  }
  P.nota = $('#nota').value.trim();
  const f = faltantes(), listo = f.length === 0;
  $('#tot').textContent = money(total());
  $('#res').textContent = m ? (listo ? textoPedido(false) : m.nombre + ' — ' + money(total())) : 'Elegí una membresía para empezar.';
  $('#falta').textContent = !m || listo ? '' : 'Falta: ' + f.join(', ') + '.';
  $('#bEnviar').disabled = !listo; $('#bCopiar').disabled = !listo;
}

// La referencia (6 letras y numeros, en el titulo del mensaje) identifica el pedido para que gestion no lo cargue dos veces si se reenvia. Pasadas 12 horas, lo mismo enviado otra vez es un pedido nuevo.
function refNueva(){
  const t = textoPedido(false);                               // el mismo pedido conserva su referencia; si cambia algo, es otro pedido
  if(P.ref && P.refTxt === t && Date.now() - P.refT < 12 * 3600 * 1000) return;
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';     // sin 0/O ni 1/I, para que no se confundan al leerla
  P.ref = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => letras[b % 32]).join(''); P.refT = Date.now(); P.refTxt = t;
}
function enviar(){
  refNueva();
  abrirWhatsApp(textoPedido(true));
}
async function copiar(){
  refNueva();
  const t = textoPedido(true), b = $('#bCopiar');
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  b.textContent = 'Copiado'; setTimeout(() => { b.textContent = 'Copiar pedido'; }, 1800);
}
iniciar();
</script>
